# Agent harness: LOCAL provider config (example / template).
# Copy to the harness's own config location on the agent host and fill in.
# Keep the real config out of git.
#
# CRITICAL: the provider must point at a LOCAL inference endpoint and a LOCAL model.
# Never a ":cloud" model, since that sends every prompt off-device and breaks the privacy
# guarantee the whole design rests on.

model:
  provider: "custom"
  base_url: "http://127.0.0.1:11434/v1"   # local model server only (loopback)
  # The brain. Swapping to a different LOCAL model is a one-line change.
  default: "<local-model-alias>"

# Behavioral safety gates.
skills:
  write_approval: true    # human review before skill creation/edits (security control #4)
memory:
  write_approval: true    # memory updates staged for review

# NOTE: harness-level approval prompts are a convenience, not a control. Headless/autonomous
# invocations may bypass them by design, so every gate that actually matters (sending,
# deleting, spending) must be STRUCTURAL, enforced outside the agent, by code the agent
# cannot call. See docs/security-model.md.
